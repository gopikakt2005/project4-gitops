apiVersion: apps/v1
kind: Deployment
metadata:
  name: project4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project4
  template:
    metadata:
      labels:
        app: project4
    spec:
      containers:
        - name: project4
          image: 265183279684.dkr.ecr.us-east-1.amazonaws.com/project4-devops:21
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: project4-service
spec:
  type: LoadBalancer
  selector:
    app: project4
  ports:
    - port: 80
      targetPort: 8000
